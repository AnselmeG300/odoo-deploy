name: CD - Deploiement Odoo sur GKE avec Carvel

# =============================================================================
# PIPELINE CD (repo de deploiement "odoo-deploy")
# =============================================================================
# Role : rendre la config Carvel (Sprint 2) avec l'image fournie, puis la
# deployer sur le cluster GKE avec kapp.
#
# Declencheurs :
#   - repository_dispatch (type new-image) : automatique, envoye par la CI
#   - workflow_dispatch                    : manuel, avec choix image/tag/env
#
# Note webhook : repository_dispatch est un evenement livre a GitHub par un
# appel d'API (le job trigger-deploy de la CI). GitHub le recoit comme un
# webhook entrant et demarre ce workflow. C'est le lien entre les deux repos.
# =============================================================================

on:
  repository_dispatch:
    types: [new-image]
  workflow_dispatch:
    inputs:
      image:
        description: "Image complete, sans le tag"
        required: true
        default: ghcr.io/anselmeg300/odoo-custom
      tag:
        description: "Tag de l'image a deployer"
        required: true
      environment:
        description: "Environnement cible"
        required: true
        default: lab
        type: choice
        options:
          - lab
          - prod

env:
  KAPP_APP: odoo
  NAMESPACE: odoo
  # Ingress Controller requis par l'Ingress (ingressClassName: nginx).
  # Le namespace doit rester "ingress-nginx" : la NetworkPolicy odoo-netpol l'autorise.
  INGRESS_NGINX_NAMESPACE: ingress-nginx
  INGRESS_NGINX_CHART_VERSION: "4.12.1"

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 : rendre les manifests avec ytt (image injectee en data value)
  # ---------------------------------------------------------------------------
  render:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.vars.outputs.environment }}
    steps:
      - name: Recuperer le code (config Carvel)
        uses: actions/checkout@v4

      - name: Resoudre les entrees (dispatch automatique ou lancement manuel)
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "image=${{ github.event.client_payload.image }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.event.client_payload.tag }}"     >> "$GITHUB_OUTPUT"
            echo "environment=lab"                                >> "$GITHUB_OUTPUT"
          else
            echo "image=${{ github.event.inputs.image }}"         >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.event.inputs.tag }}"             >> "$GITHUB_OUTPUT"
            echo "environment=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Installer ytt
        run: |
          curl -sL -o /usr/local/bin/ytt \
            https://github.com/carvel-dev/ytt/releases/latest/download/ytt-linux-amd64
          chmod +x /usr/local/bin/ytt
          ytt version

      - name: Rendre les manifests
        run: |
          EXTRA=""
          if [ "${{ steps.vars.outputs.environment }}" = "prod" ]; then
            EXTRA="-f values/values-prod.yaml -f overlays/prod-resources.yaml"
          fi
          ytt -f config/ $EXTRA \
            --data-value odoo.image=${{ steps.vars.outputs.image }} \
            --data-value odoo.tag=${{ steps.vars.outputs.tag }} \
            > rendered.yaml
          echo "----- Apercu de l'image deployee -----"
          grep -n "image:" rendered.yaml | grep odoo

      - name: Publier les manifests rendus comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-manifests
          path: rendered.yaml

  # ---------------------------------------------------------------------------
  # JOB 2 : deployer sur GKE avec kapp
  #   - needs: render   -> recupere l'artefact rendu
  # ---------------------------------------------------------------------------
  deploy:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer les manifests rendus
        uses: actions/download-artifact@v4
        with:
          name: rendered-manifests

      - name: Installer kapp
        run: |
          curl -sL -o /usr/local/bin/kapp \
            https://github.com/carvel-dev/kapp/releases/latest/download/kapp-linux-amd64
          chmod +x /usr/local/bin/kapp
          kapp version

      # -----------------------------------------------------------------------
      # ACCES AU CLUSTER : deux modes, choisis automatiquement
      #   - "kubeconfig" : secret KUBE_CONFIG defini (jeton d'un ServiceAccount
      #     Kubernetes, voir README C.4). Aucun droit IAM Google necessaire :
      #     c'est le mode des projets bac a sable ou l'IAM est verrouille.
      #   - "gcloud"     : sinon, cle Google GKE_SA_KEY + get-gke-credentials
      #     (exige container.clusters.get cote IAM Google).
      # Un secret ne peut pas etre teste directement dans un "if:", d'ou ce
      # step qui expose le mode choisi en output.
      # -----------------------------------------------------------------------
      - name: Choisir le mode d'acces au cluster
        id: access
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -n "$KUBE_CONFIG" ]; then
            echo "mode=kubeconfig" >> "$GITHUB_OUTPUT"
            echo "Acces au cluster : kubeconfig (secret KUBE_CONFIG)"
          else
            echo "mode=gcloud" >> "$GITHUB_OUTPUT"
            echo "Acces au cluster : cle Google (secret GKE_SA_KEY)"
          fi

      # Mode kubeconfig
      - name: Configurer l'acces au cluster (kubeconfig)
        if: steps.access.outputs.mode == 'kubeconfig'
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBE_CONFIG" > ~/.kube/config
          chmod 600 ~/.kube/config

      # Mode gcloud
      - name: S'authentifier aupres de Google Cloud
        if: steps.access.outputs.mode == 'gcloud'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GKE_SA_KEY }}

      - name: Recuperer les acces au cluster GKE
        if: steps.access.outputs.mode == 'gcloud'
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER }}
          location: ${{ secrets.GKE_LOCATION }}

      - name: Verifier la connexion au cluster
        run: kubectl get nodes

      # Sans Ingress Controller, l'Ingress n'a pas d'adresse et Odoo n'est pas
      # joignable depuis Internet. Installation seulement s'il manque :
      #   - deja present (installe a la main, Etape 7) -> rien a faire ;
      #   - absent -> helm l'installe, ce qui exige des droits sur les objets
      #     cluster-scoped (ClusterRole, IngressClass, webhook) : cluster-admin
      #     en mode kubeconfig, roles/container.admin en mode gcloud.
      - name: Verifier / installer l'Ingress Controller (ingress-nginx)
        run: |
          if kubectl get deployment ingress-nginx-controller \
               -n "$INGRESS_NGINX_NAMESPACE" >/dev/null 2>&1; then
            echo "ingress-nginx deja present : installation ignoree."
          else
            echo "ingress-nginx absent : installation du chart $INGRESS_NGINX_CHART_VERSION"
            helm version
            helm upgrade --install ingress-nginx ingress-nginx \
              --repo https://kubernetes.github.io/ingress-nginx \
              --version "$INGRESS_NGINX_CHART_VERSION" \
              --namespace "$INGRESS_NGINX_NAMESPACE" --create-namespace \
              --wait --timeout 5m \
              || { echo "::error::Echec de l'installation d'ingress-nginx. Si l'erreur est 'forbidden', installer le controleur a la main (README Etape 7) ou donner roles/container.admin au compte de service."; exit 1; }
          fi
          # Le webhook d'admission doit etre pret avant que kapp cree l'Ingress
          kubectl rollout status deployment/ingress-nginx-controller \
            -n "$INGRESS_NGINX_NAMESPACE" --timeout=5m

      # Pas de -n : le namespace odoo est cree par rendered.yaml (00-base.yaml).
      # kapp enregistre l'etat de l'application (ConfigMap) dans le namespace
      # par defaut du kubeconfig ("default"), qui existe toujours.
      - name: Deployer avec kapp
        run: |
          kapp deploy -a ${{ env.KAPP_APP }} -f rendered.yaml --yes

      - name: Afficher l'adresse publique
        run: |
          LB_IP=$(kubectl get svc ingress-nginx-controller -n "$INGRESS_NGINX_NAMESPACE" \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          kubectl get ingress -n ${{ env.NAMESPACE }}
          if [ -n "$LB_IP" ]; then
            echo "Odoo est expose via le load balancer : http://$LB_IP/"
            echo "### Odoo deploye : http://$LB_IP/" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::IP publique pas encore attribuee (EXTERNAL-IP pending)."
          fi
